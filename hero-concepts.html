<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Hero concepts — StraightFrwd</title>
<link rel="stylesheet" href="assets/style.css?v=1792500064">
<style>
  /* the artwork already carries its own headline, so no scrim over it */
  .hero.baked .slide .bg::after{display:none}
  .hero.baked .slide .bg img{object-position:center}
  .hero.baked .slides{min-height:min(78vh,660px)}
  .hero.baked .slide{align-items:stretch}
  @media(max-width:760px){
    /* cropping a 16:9 frame to a tall hero cuts the baked headline off,
       so show the whole composition instead and let the section shrink */
    .hero.baked .slides{min-height:0}
    .hero.baked .slide{position:relative}
    .hero.baked .slide:not(.on){position:absolute;inset:0}
    .hero.baked .slide .bg{position:relative;inset:auto}
    .hero.baked .slide .bg img{height:auto;aspect-ratio:16/9;object-fit:cover;object-position:center}
  }
  .hc-ui{display:flex;align-items:center;gap:16px;padding:20px 0 0;flex-wrap:wrap}
  .hc-ui .cap{font-size:15.5px;opacity:.74;margin:0;min-height:44px;
    display:flex;flex-direction:column;justify-content:center;max-width:52ch}
  .hc-ui .cap b{display:block;font:800 11.5px/1 var(--font);letter-spacing:.15em;
    text-transform:uppercase;color:var(--brand);opacity:1;margin-bottom:6px}
  .hc-dots{display:flex;gap:9px;margin-left:auto}
  .hc-dots button{width:9px;height:9px;padding:0;border:0;border-radius:999px;cursor:pointer;
    background:rgba(42,23,16,.24);transition:.2s}
  .hc-dots button[aria-current="true"]{background:var(--brand);width:26px}
  .hc-arrows{display:flex;gap:10px}
  .hc-arrows button{width:44px;height:44px;border-radius:999px;border:0;cursor:pointer;
    background:var(--paper-2);color:var(--brand);display:grid;place-items:center;transition:.18s}
  .hc-arrows button:hover{background:var(--brand);color:#fff}
  .hc-arrows svg{width:17px;height:17px;fill:currentColor}
  @media(max-width:620px){.hc-dots{margin-left:0;width:100%;order:3}}
</style></head><body>

<section class="hero baked">
  <div class="slides" id="slides">
    <div class="slide on"><div class="bg"><img src="assets/img/hero-c1-mango.jpg" alt="Mango Protein Powder on a sunlit terrace"></div></div>
    <div class="slide"><div class="bg"><img src="assets/img/hero-c2-kulfi.jpg" alt="Kulfi Protein Powder on a balcony at dusk"></div></div>
    <div class="slide"><div class="bg"><img src="assets/img/hero-c3-choc.jpg" alt="Chocolate Protein Powder on a kitchen counter"></div></div>
  </div>
</section>

<div class="wrap">
  <div class="hc-ui">
    <div class="hc-arrows">
      <button id="prv" aria-label="Previous"><svg viewBox="0 0 34 20" style="transform:scaleX(-1)"><path d="M0 0 L0 20 L15 10 Z"/><path d="M17 0 L17 20 L32 10 Z"/></svg></button>
      <button id="nxt" aria-label="Next"><svg viewBox="0 0 34 20"><path d="M0 0 L0 20 L15 10 Z"/><path d="M17 0 L17 20 L32 10 Z"/></svg></button>
    </div>
    <p class="cap" id="cap"></p>
    <div class="hc-dots" id="dts"></div>
  </div>
</div>

<section class="sec tight"><div class="wrap" style="max-width:860px;padding-bottom:70px">
  <div class="eyebrow">Internal review</div>
  <h2 style="font-size:clamp(26px,3.2vw,36px);margin-bottom:14px">Three hero frames, one per flavour</h2>
  <p style="opacity:.74;font-size:16.5px;line-height:1.65;max-width:62ch">Each one is shot in a setting that belongs to that flavour, and the headline is baked into the artwork, so the hero needs no text overlay and no scrim. Pick one as the homepage opener, or run all three as the reel.</p>
</div></section>

<script src="assets/app.js?v=1792500064"></script>
<script>
chrome('hero-concepts.html');
const caps = [
  ['Mango · Terrace','Mango Protein Powder, 30 g sachet. Shot where the fruit belongs.'],
  ['Kulfi · Balcony at dusk','Kulfi Protein Powder, 30 g sachet. Cardamom, pistachio, end of a hot day.'],
  ['Chocolate · Kitchen counter','Chocolate Protein Powder, 50 g sachet and 1 kg pouch. Mixes in plain water.']
];
const sl=[...document.querySelectorAll('#slides .slide')], dts=document.getElementById('dts'), cap=document.getElementById('cap');
let i=0;
caps.forEach((_,n)=>{const b=document.createElement('button');b.onclick=()=>go(n);dts.appendChild(b)});
function go(n){ i=(n+sl.length)%sl.length;
  sl.forEach((s,k)=>s.classList.toggle('on',k===i));
  cap.innerHTML='<b>'+caps[i][0]+'</b>'+caps[i][1];
  [...dts.children].forEach((b,k)=>b.setAttribute('aria-current',k===i));
}
document.getElementById('nxt').onclick=()=>go(i+1);
document.getElementById('prv').onclick=()=>go(i-1);
go(0);
</script>
</body></html>
